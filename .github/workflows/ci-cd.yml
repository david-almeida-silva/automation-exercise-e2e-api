name: Testes E2E e API - Automation Exercise

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  testes-automatizados:
    runs-on: ubuntu-latest

    steps:
    - name: Fazer o checkout do código
      uses: actions/checkout@v3

    - name: Configurar o Java (JDK 17)
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Instalar dependências e rodar TODOS os testes
      run: mvn clean test
      continue-on-error: true # Continua mesmo se um teste falhar

    - name: Gerar o Relatório Allure nativo com Maven
      run: mvn allure:report # Usamos o próprio Maven ao invés do robô de terceiros

    - name: Publicar relatório no GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: target/site/allure-maven-plugin # Pasta onde o Maven salva o HTML